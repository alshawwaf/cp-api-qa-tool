[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-api-qa-tool"
version = "1.0.0"
description = "Self-healing QA engine for Check Point Management API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.7",
    "certifi>=2023.7.22",
]

[project.scripts]
cp-qa = "cp_qa.cli:main"

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
